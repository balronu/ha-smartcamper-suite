name: Validate
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install pytest ruff
      - run: python -m pytest
      - run: ruff check .
      - run: python -m compileall -q custom_components tests
      - run: python -m json.tool custom_components/smartcamper_suite/manifest.json >/dev/null
      - run: python -m json.tool hacs.json >/dev/null
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm install
      - run: npm test
      - run: npm run build
