set_credential:
  name: Set provider credential
  description: Store or replace one shared provider API key for the Suite entry.
  fields:
    entry_id:
      name: Config entry
      required: true
      selector:
        text:
    credential_id:
      name: Credential ID
      required: true
      selector:
        text:
    provider:
      name: Provider
      required: true
      selector:
        select:
          options:
            - tankerkoenig
            - petromap
            - nakordoni
    api_key:
      name: API key
      required: true
      selector:
        text:
          type: password
remove_credential:
  name: Remove provider credential
  description: Remove one shared provider credential from the Suite runtime.
  fields:
    entry_id:
      name: Config entry
      required: true
      selector:
        text:
    credential_id:
      name: Credential ID
      required: true
      selector:
        text:

